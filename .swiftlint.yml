disabled_rules:
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - vertical_parameter_alignment_on_call
  - opening_brace
  - closure_parameter_position

included:
  - ibk-products

excluded:
  - Tests

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - comment_spacing
  - empty_count
  - explicit_init
  - extension_access_modifier
  - fatal_error_message
  - first_where
  - force_cast
  - force_unwrapping
  - implicitly_unwrapped_optional
  - multiline_parameters
  - nesting
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - protocol_property_accessors_order
  - redundant_nil_coalescing
  - reduce_into
  - reduce_boolean
  - sorted_imports
  - syntactic_sugar
  - vertical_whitespace
  - private_outlet
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

identifier_name:
  excluded:
    - id

implicitly_unwrapped_optional:
  mode: all_except_iboutlets

line_length:
  warning: 120
  error: 140
  ignores_comments: true

large_tuple:
  warning: 4
  error: 5

type_body_length:
  warning: 300
  error: 400

number_separator:
  minimum_length: 5

private_outlet:
  allow_private_set: false

colon: error
comma: error
empty_count: error
legacy_constant: error
legacy_constructor: error
trailing_newline: error
trailing_semicolon: error
